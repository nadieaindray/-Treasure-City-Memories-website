<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
        }

        .nav1 {
            background-color: rgba(100, 149, 237, 0.7);
            padding: 10px 0;
            border-bottom: 1px solid rgba(100, 149, 237, 0.3);
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative;
        }

        .nav1 .logo img {
            width: 50px;
            padding-left: 20px;
        }

        .nav1 ul {
            list-style-type: none;
            padding: 0;
            margin: 0;
            overflow: hidden;
            display: flex;
        }

        .nav1 ul li {
            color: white;
            text-decoration: none;
            padding: 10px;
            display: block;
            text-align: center;
        }

        .nav1 ul li a {
            color: white;
            text-decoration: none;
            padding: 10px;
            display: block;
            text-align: center;
        }

        .nav1 ul li:hover {
            background-color: rgba(70, 130, 180, 0.8);
        }

        .form {
            color: #0078d7;
            margin-left: 20px;
            margin-top: 20px;
        }

        button {
            background-color: #0078d7;
            border: 0px;
            width: 90px;
            height: 30px;
            color: aliceblue;
        }

        span {
            color: rgb(182, 5, 5);
        }
    </style>
</head>

<body>
    <nav class="nav1">
        <div id="menu-icon">
            <i class="fas fa-bars"></i>
        </div>
        <ul>
            <li class="nav"><a href="Home page.html">Home</a></li>
            <li class="nav"><a href="Menu page.html">Menu</a></li>
            <li class="nav"><a href="Login .html">Log In</a></li>
            <li class="nav"><a href="Sign up.html">Sign Up</a></li>
        </ul>

    </nav>
    <form id="mainForm">
        <div class="form">
            <div class="Email">
                <label for="Email" class="form-label">Email</label><br><br>
                <input type="email" id="email"><br><br>
                <span class="required" id="email-required">Email address is required.</span><br><br>
            </div>
            <div class="password">
                <label for="Password" class="form-label">Password</label><br><br>
                <input type="password" id="password"><br><br>
                <span class="required" id="password-required">Password is required.</span><br><br>
            </div>
            <div>
                <button type="submit" class="submit-button">Submit!</button>
            </div>
        </div>
    </form>
    <script>
        let emailInput = document.getElementById("email");
        let passwordInput = document.getElementById("password");
        let submitButton = document.querySelector(".submit-button");
        let emailErrorSpan = document.getElementById("email-required");
        let passwordErrorSpan = document.getElementById("password-required");

        // --- Initially hide the error messages ---
        emailErrorSpan.style.display = "none";
        passwordErrorSpan.style.display = "none";

        // --- Get existing users from localStorage or initialize an empty array ---
        let users = JSON.parse(localStorage.getItem("users")) || [];

        submitButton.addEventListener("click", function (event) {
            event.preventDefault();

            let isFormValid = true;

            if (emailInput.value === "") {
                emailErrorSpan.style.display = "block";
                isFormValid = false;
            } else {
                emailErrorSpan.style.display = "none";
            }

            if (passwordInput.value === "") {
                passwordErrorSpan.style.display = "block";
                isFormValid = false;
            } else {
                passwordErrorSpan.style.display = "none";
            }

            if (isFormValid) {
                // --- Check if the user is trying to sign up or log in ---
                if (users.some(user => user.userEmail === emailInput.value)) {
                    // --- Login ---
                    let loginSuccessful = false;
                    for (let i = 0; i < users.length; i++) {
                        if (users[i].userEmail === emailInput.value && users[i].userPassword === passwordInput.value) {
                            alert("Login Successful!");
                            window.location.href = "Menu page.html"; // Redirect on successful login
                            loginSuccessful = true;
                            break;
                        }
                    }
                    if (!loginSuccessful) {
                        alert("Email or Password is wrong");
                    }
                } else {
                    // --- Sign Up (New User) ---
                    let newUser = {
                        userEmail: emailInput.value,
                        userPassword: passwordInput.value
                    };
                    users.push(newUser);
                    localStorage.setItem("users", JSON.stringify(users));
                    alert("Sign Up Successful! You can now log in.");
                    //  window.location.href = "menupage.html"; // Removed redirect after signup
                }
            }
        });

        window.onload = function () {
            //  Removed the automatic submit on load.
        };
    </script>
</body>

</html>
