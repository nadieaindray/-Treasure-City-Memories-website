<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
        }

        .nav1 {
            background-color: rgba(100, 149, 237, 0.7);
            padding: 10px 0;
            border-bottom: 1px solid rgba(100, 149, 237, 0.3);
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative;
        }

        .nav1 .logo img {
            width: 50px;
            padding-left: 20px;
        }

        .nav1 ul {
            list-style-type: none;
            padding: 0;
            margin: 0;
            overflow: hidden;
            display: flex;
        }

        .nav1 ul li {
            color: white;
            text-decoration: none;
            padding: 10px;
            display: block;
            text-align: center;
        }

        .nav1 ul li a {
            color: white;
            text-decoration: none;
            padding: 10px;
            display: block;
            text-align: center;
        }

        .nav1 ul li:hover {
            background-color: rgba(70, 130, 180, 0.8);
        }

        .banner {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: auto;
            padding: 20px;
            text-align: center;
            max-height: 400px;
            overflow: hidden;
        }

        .banner-text {
            margin-top: 20px;
            margin-bottom: 20px;
            padding: 0 10px;
        }

        .banner-images {
            display: flex;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            -webkit-overflow-scrolling: touch;
            margin-bottom: 20px;
            padding-left: 20px;
            max-height: 400px;
        }

        .banner-images img {
            flex: 0 0 80%;
            height: 300px;
            object-fit: cover;
            scroll-snap-align: center;
            margin-right: 20px;
        }

        .button {
            display: flex;
            justify-content: center;
            margin-top: 20px;
            margin-bottom: 20px;
        }

        .button div {
            margin-right: 20px;
            background-color: rgb(165, 165, 233);
            color: aliceblue;
            width: 120px;
            height: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 5px;
        }

        .button div a {
            color: aliceblue;
            text-decoration: none;
        }

        @media (min-width: 375px) and (max-width: 767px) {


            .banner {
                order: 2;
                max-height: none;
            }

            .banner-images {
                flex-direction: column;
                align-items: center;
                padding-left: 0;
            }

            .banner-images img {
                width: 300px;
                height: auto;
                max-height: 400px;
                margin: 10px auto;
            }

            .button {
                order: 3;
                flex-direction: column;
                align-items: center;
            }

            .button div {
                margin: 10px auto;
            }
        }

        @media (min-width: 768px) and (max-width: 1999px) {

            .banner {
                order: 1;
                max-height: 600px;
                
            }

            .banner-images {
                flex-direction: flex;
                padding-left: 20px;
                width: 400px;
            }

            .banner-images img {
                flex: 0 0 80%;
                height: 300px;
                object-fit: cover;
                scroll-snap-align: center;
                margin-right: 20px;
                width: 400px;
                height: 500px;
            }

            .button {
                flex-direction: flex;
                margin-top: 20px;
                margin-bottom: 20px;
            }

            .button div {
                margin-right: 20px;
                margin-bottom: 0;
            }
        }

        @media (max-width: 480px) {

            .banner-images img {
                height: 200px;
            }

            .banner-text {
                font-size: 0.9rem;
            }
        }
    </style>
</head>

<body>
    <nav class="nav1">
        <div class="logo">
            <img src="p2.jpg" alt="">
        </div>
        <ul class="">
            <li class="nav"><a href="Home page.html">Home</a></li>
            <li class="nav"><a href="Menu page.html">Menu</a></li>
            <li class="nav"><a href="Login .html">Log In</a></li>
            <li class="nav"><a href="Sign up.html">Sign Up</a></li>
        </ul>
    </nav>
    <div id="overlay"></div>
    <div class="banner">
        <div class="banner-text">
            Hey there! Welcome to our Treasure City Memories website.<br>
            Welcome to our online taste of Myanmar! <br>
            We offer a vibrant selection of authentic Burmese dishes and refreshing drinks,<br>
            bringing the unique flavors of our culture right to your door.
        </div>
        <div class="banner-images">
            <img src="p1 .jpg" alt="p1">
            <img src="p2.jpg" alt="p1">
            <img src="p4.jpg" alt="p1">
        </div>
    </div>
    <div class="button">
        <div class="log-in"><a href="Login .html">Log in</a></div>
        <div class="sign-up"><a href="Sign up.html">Sign up</a></div>
    </div>

</body>

</html>
